defaults:
  - default_dataset.yaml

exp_name: objaverse_exp
img_size: 224
num_workers: 8
seed_value: 42
accum_steps: 1
patch_size: 14
val_epoch_freq: 5
max_img_per_gpu: 128

limit_train_batches: 800
limit_val_batches: 200

data:
  train:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    shuffle: True
    pin_memory: False
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      debug: False
      repeat_batch: False
      fix_img_num: -1
      fix_aspect_ratio: 1.0
      load_track: False
      track_num: 1024
      training: True
      inside_random: True
      rescale: True
      rescale_aug: True
      landscape_check: False
      get_nearby: False          # keep first four views
      load_depth: True
      img_nums: [4, 4]
      max_img_per_gpu: ${max_img_per_gpu}
      allow_duplicate_img: False
      augs:
        cojitter: True
        cojitter_ratio: 0.3
        scales: [0.9, 1.1]
        aspects: [1.0, 1.0]
        color_jitter:
          brightness: 0.4
          contrast: 0.4
          saturation: 0.4
          hue: 0.05
          p: 0.9
        gray_scale: False
        gau_blur: False
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.objaverse.ObjaverseDataset
          root: /home/vgl/objaverse-nn/data/mnt/pfs/data/texture_ortho10view_easylight_objaverse
          split: train
          min_num_images: 4
          len_train: null
          assume_opengl_coords: True
          train_val_split: 0.9
          split_seed: 42

  val:
    _target_: data.dynamic_dataloader.DynamicTorchDataset
    num_workers: ${num_workers}
    max_img_per_gpu: ${max_img_per_gpu}
    shuffle: False
    pin_memory: False
    common_config:
      img_size: ${img_size}
      patch_size: ${patch_size}
      debug: False
      repeat_batch: False
      fix_img_num: -1
      fix_aspect_ratio: 1.0
      load_track: False
      track_num: 1024
      training: False
      inside_random: True
      rescale: True
      rescale_aug: False
      landscape_check: False
      get_nearby: False
      load_depth: True
      img_nums: [4, 4]
      allow_duplicate_img: False
      augs:
        cojitter: False
        cojitter_ratio: 0.5
        scales: null
        aspects: [1.0, 1.0]
        color_jitter: null
        gray_scale: False
        gau_blur: False
    dataset:
      _target_: data.composed_dataset.ComposedDataset
      dataset_configs:
        - _target_: data.datasets.objaverse.ObjaverseDataset
          root: /home/vgl/objaverse-nn/data/mnt/pfs/data/texture_ortho10view_easylight_objaverse
          split: test
          min_num_images: 4
          len_test: null
          assume_opengl_coords: True
          train_val_split: 0.9
          split_seed: 42

logging:
  log_dir: logs
  log_visuals: True
  log_freq: 1
  log_level_primary: DEBUG
  log_level_secondary: WARNING
  all_ranks: False
  tensorboard_writer:
    _target_: train_utils.tb_writer.TensorBoardLogger
    path: ${logging.log_dir}/tensorboard
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_camera
        - loss_T
        - loss_R
        - loss_FL
        - loss_conf_depth
        - loss_reg_depth
        - loss_grad_depth
    val:
      keys_to_log:
        - loss_objective
        - loss_camera
        - loss_T
        - loss_R
        - loss_FL
        - loss_conf_depth
        - loss_reg_depth
        - loss_grad_depth
  log_visual_frequency:
    train: 500
    val: 1
  visuals_keys_to_log:
    train:
      modality: image
      keys_to_log:
        - images
        - depth
        - depths
    val:
      modality: image
      keys_to_log:
        - images
        - depth
        - depths
  visuals_per_batch_to_log: 4
  video_logging_fps: 4

checkpoint:
  save_dir: logs/${exp_name}/ckpts
  save_freq: 5
  resume_checkpoint_path: null   # set or null
  strict: False

loss:
  _target_: loss.MultitaskLoss
  camera:
    weight: 5.0
    loss_type: "l1"
  depth:
    weight: 1.0
    gradient_loss_fn: "grad"
    valid_range: 0.98
  point: null
  track: null

optim:
  param_group_modifiers: False
  optimizer:
    _target_: torch.optim.AdamW
    lr: 5e-5
    weight_decay: 0.05
  frozen_module_names: []
  amp:
    enabled: True
    amp_dtype: bfloat16
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: ["aggregator"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["depth"]
        max_norm: 1.0
        norm_type: 2
      - module_name: ["camera"]
        max_norm: 1.0
        norm_type: 2
  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CompositeParamScheduler
          schedulers:
            - _target_: fvcore.common.param_scheduler.LinearParamScheduler
              start_value: 1e-8
              end_value: 5e-5
            - _target_: fvcore.common.param_scheduler.CosineParamScheduler
              start_value: 5e-5
              end_value: 1e-8
          lengths: [0.05, 0.95]
          interval_scaling: ['rescaled', 'rescaled']
    weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.05

model:
  _target_: vggt.models.vggt.VGGT
  img_size: ${img_size}
  patch_size: ${patch_size}
  embed_dim: 384
  enable_camera: True
  enable_depth: True
  enable_point: False
  enable_track: False
  aggregator_cfg:
    depth: 12
    num_heads: 6
    patch_embed: dinov2_vits14_reg
    mlp_ratio: 4.0
  depth_head_cfg:
    intermediate_layer_idx: [2, 5, 8, 11]

distributed:
  backend: nccl
  comms_dtype: None
  find_unused_parameters: False
  timeout_mins: 30
  gradient_as_bucket_view: True
  bucket_cap_mb: 25
  broadcast_buffers: True

cuda:
  cudnn_deterministic: False
  cudnn_benchmark: False
  allow_tf32: True

max_epochs: 20
