defaults:
  - default_dataset.yaml

exp_name: objaverse_depth_only
img_size: 224
num_workers: 8
seed_value: 42
accum_steps: 1
patch_size: 14
val_epoch_freq: 1
max_img_per_gpu: 48

limit_train_batches: 1000000
limit_val_batches: 1000000

data:
  train:
    _target_: data.objaverse_module.ObjaverseDataModule
    root: /YOUR/PATH/TO/OBJAVERSE
    image_size: ${img_size}
    num_views: 4
    view_ids: [0,1,2,3]
    batch_size: 4
    num_workers: ${num_workers}
    shuffle: True
    subset_start: 0.0
    subset_end: 0.9
  val:
    _target_: data.objaverse_module.ObjaverseDataModule
    root: /YOUR/PATH/TO/OBJAVERSE
    image_size: ${img_size}
    num_views: 4
    view_ids: [0,1,2,3]
    batch_size: 4
    num_workers: ${num_workers}
    shuffle: False
    subset_start: 0.9
    subset_end: 1.0

logging:
  log_dir: logs
  log_visuals: False
  log_freq: 10
  log_level_primary: INFO
  log_level_secondary: WARNING
  all_ranks: False
  tensorboard_writer:
    _target_: train_utils.tb_writer.TensorBoardLogger
    path: ${logging.log_dir}/tensorboard
  scalar_keys_to_log:
    train:
      keys_to_log:
        - loss_objective
        - loss_conf_depth
        - loss_reg_depth
        - loss_grad_depth
    val:
      keys_to_log:
        - loss_objective
        - loss_conf_depth
        - loss_reg_depth
        - loss_grad_depth

checkpoint:
  save_dir: logs/${exp_name}/ckpts
  save_freq: 1
  resume_checkpoint_path: null
  strict: False

loss:
  _target_: loss.MultitaskLoss
  camera: null
  depth:
    weight: 1.0
    gradient_loss_fn: "grad"
    valid_range: 0.98
  point: null
  track: null

optim:
  param_group_modifiers: False
  optimizer:
    _target_: torch.optim.AdamW
    lr: 2e-4
    weight_decay: 0.05
  frozen_module_names: []
  amp:
    enabled: True
    amp_dtype: bfloat16
  gradient_clip:
    _target_: train_utils.gradient_clip.GradientClipper
    configs:
      - module_name: ["depth"]
        max_norm: 1.0
        norm_type: 2
  options:
    lr:
      - scheduler:
          _target_: fvcore.common.param_scheduler.CosineParamScheduler
          start_value: 2e-4
          end_value: 1e-6
      
    weight_decay:
      - scheduler:
          _target_: fvcore.common.param_scheduler.ConstantParamScheduler
          value: 0.05

max_epochs: 10

model:
  _target_: vggt.models.vggt.VGGT
  enable_camera: False
  enable_depth: True
  enable_point: False
  enable_track: False
  camera_context_dim: 7

distributed:
  backend: nccl
  comms_dtype: None
  find_unused_parameters: False
  timeout_mins: 30
  gradient_as_bucket_view: True
  bucket_cap_mb: 25
  broadcast_buffers: True

cuda:
  cudnn_deterministic: False
  cudnn_benchmark: False
  allow_tf32: True


